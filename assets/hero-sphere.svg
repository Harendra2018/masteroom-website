<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Glowing chrome sphere being stitched into a spherical HDRI">
  <defs>
    <linearGradient id="sphBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1330"/>
      <stop offset="100%" stop-color="#060e24"/>
    </linearGradient>
    <radialGradient id="sphBall" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#eaf6ff"/>
      <stop offset="28%" stop-color="#8fe3ff"/>
      <stop offset="60%" stop-color="#1b6fa8"/>
      <stop offset="100%" stop-color="#04162e"/>
    </radialGradient>
    <radialGradient id="sphGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00F2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphVignette" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#0a1330" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060e24" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="320" fill="url(#sphBg)"/>

  <!-- ambient starfield dots -->
  <g fill="#EAF0FF" opacity="0.35">
    <circle cx="120" cy="60" r="1.6"/>
    <circle cx="220" cy="240" r="1.4"/>
    <circle cx="980" cy="70" r="1.6"/>
    <circle cx="1080" cy="250" r="1.4"/>
    <circle cx="60" cy="180" r="1.2"/>
    <circle cx="1140" cy="150" r="1.4"/>
    <circle cx="330" cy="40" r="1.2"/>
    <circle cx="870" cy="270" r="1.2"/>
  </g>

  <!-- outer glow -->
  <circle cx="600" cy="160" r="205" fill="url(#sphGlow)"/>

  <!-- the chrome sphere -->
  <circle cx="600" cy="160" r="118" fill="url(#sphBall)"/>

  <!-- equirectangular stitch lines (latitude / longitude) -->
  <g fill="none" stroke="#052033" stroke-opacity="0.55" stroke-width="1.5">
    <ellipse cx="600" cy="160" rx="118" ry="34"/>
    <ellipse cx="600" cy="160" rx="118" ry="70"/>
    <ellipse cx="600" cy="160" rx="34" ry="118"/>
    <ellipse cx="600" cy="160" rx="70" ry="118"/>
    <line x1="482" y1="160" x2="718" y2="160"/>
    <line x1="600" y1="42" x2="600" y2="278"/>
  </g>

  <!-- bright specular highlight (chrome-ball look) -->
  <ellipse cx="562" cy="118" rx="30" ry="18" fill="#ffffff" opacity="0.75"/>
  <ellipse cx="600" cy="160" rx="118" ry="118" fill="none" stroke="#00F2FF" stroke-opacity="0.5" stroke-width="2"/>

  <!-- seam-correction stitch markers around the equator -->
  <g fill="#00F2FF">
    <circle cx="482" cy="160" r="5"/>
    <circle cx="718" cy="160" r="5"/>
    <circle cx="600" cy="42" r="5"/>
    <circle cx="600" cy="278" r="5"/>
  </g>
  <g stroke="#6ee7a8" stroke-width="2" stroke-dasharray="3 6" fill="none" opacity="0.8">
    <path d="M 718 160 A 118 118 0 0 1 600 278"/>
  </g>

  <!-- unwrapped HDRI strip, panning off to the right -->
  <g transform="translate(860,120)">
    <rect x="0" y="0" width="260" height="80" rx="6" fill="#0c1630" stroke="#00F2FF" stroke-opacity="0.5" stroke-width="1.5"/>
    <g stroke="#00F2FF" stroke-opacity="0.35" stroke-width="1">
      <path d="M 0 20 Q 65 5 130 20 T 260 20"/>
      <path d="M 0 40 Q 65 40 130 40 T 260 40"/>
      <path d="M 0 60 Q 65 75 130 60 T 260 60"/>
    </g>
    <circle cx="60" cy="40" r="10" fill="#8fe3ff" opacity="0.8"/>
    <circle cx="185" cy="30" r="7" fill="#eaf6ff" opacity="0.6"/>
  </g>
  <g stroke="#00F2FF" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.6">
    <path d="M 705 145 L 858 155" fill="none"/>
  </g>

  <rect x="0" y="0" width="1200" height="320" fill="url(#sphVignette)"/>
</svg>
