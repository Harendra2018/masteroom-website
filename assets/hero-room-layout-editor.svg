<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wireframe room layout over a glowing floor grid">
  <defs>
    <linearGradient id="rleBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1330"/>
      <stop offset="100%" stop-color="#060e24"/>
    </linearGradient>
    <linearGradient id="rleGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F2FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F2FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rleFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F2FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00F2FF" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="rleVignette" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#0a1330" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060e24" stop-opacity="0.9"/>
    </radialGradient>
    <mask id="rleFade">
      <linearGradient id="rleFadeGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="white" stop-opacity="0.9"/>
        <stop offset="92%" stop-color="white" stop-opacity="0"/>
      </linearGradient>
      <rect x="0" y="100" width="1200" height="220" fill="url(#rleFadeGrad)"/>
    </mask>
  </defs>

  <rect x="0" y="0" width="1200" height="320" fill="url(#rleBg)"/>

  <!-- perspective floor grid -->
  <g mask="url(#rleFade)" stroke="#00F2FF" stroke-opacity="0.45" stroke-width="1">
    <g>
      <line x1="0" y1="130" x2="1200" y2="130"/>
      <line x1="0" y1="160" x2="1200" y2="160"/>
      <line x1="0" y1="196" x2="1200" y2="196"/>
      <line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="0" y1="295" x2="1200" y2="295"/>
    </g>
    <g>
      <line x1="600" y1="130" x2="600" y2="320"/>
      <line x1="520" y1="130" x2="440" y2="320"/>
      <line x1="440" y1="130" x2="280" y2="320"/>
      <line x1="360" y1="130" x2="120" y2="320"/>
      <line x1="280" y1="130" x2="-40" y2="320"/>
      <line x1="680" y1="130" x2="760" y2="320"/>
      <line x1="760" y1="130" x2="920" y2="320"/>
      <line x1="840" y1="130" x2="1080" y2="320"/>
      <line x1="920" y1="130" x2="1240" y2="320"/>
    </g>
  </g>

  <rect x="0" y="0" width="1200" height="320" fill="url(#rleVignette)"/>

  <!-- floating wireframe room box (isometric) -->
  <g transform="translate(600,160)">
    <!-- soft glow behind the box -->
    <ellipse cx="0" cy="40" rx="260" ry="46" fill="url(#rleFloor)" opacity="0.5"/>

    <!-- back edges (dimmer) -->
    <g stroke="#5AD9FF" stroke-opacity="0.35" stroke-width="2" fill="none">
      <path d="M -170 -20 L 0 -95 L 170 -20"/>
      <path d="M -170 -20 L -170 55"/>
      <path d="M 170 -20 L 170 55"/>
      <path d="M 0 -95 L 0 -20"/>
    </g>

    <!-- front/floor outline (bright) -->
    <g stroke="#00F2FF" stroke-width="2.5" fill="none" stroke-linejoin="round">
      <path d="M -170 55 L 0 130 L 170 55 L 0 -20 Z"/>
      <path d="M -170 -20 L -170 55"/>
      <path d="M 170 -20 L 170 55"/>
      <path d="M 0 -95 L 0 -20"/>
      <path d="M -170 -20 L 0 -95 L 170 -20 L 0 -20 Z"/>
    </g>

    <!-- corner placement markers -->
    <g fill="#00F2FF">
      <circle cx="-170" cy="-20" r="6"/>
      <circle cx="170" cy="-20" r="6"/>
      <circle cx="0" cy="-95" r="6"/>
      <circle cx="0" cy="-20" r="6"/>
      <circle cx="-170" cy="55" r="7"/>
      <circle cx="170" cy="55" r="7"/>
      <circle cx="0" cy="130" r="7"/>
    </g>
    <g fill="none" stroke="#EAF0FF" stroke-opacity="0.6" stroke-width="1.5">
      <circle cx="-170" cy="55" r="12"/>
      <circle cx="170" cy="55" r="12"/>
      <circle cx="0" cy="130" r="12"/>
    </g>

    <!-- hotspot navigation dot + link -->
    <g stroke="#6ee7a8" stroke-width="2" stroke-dasharray="4 5" fill="none" opacity="0.85">
      <path d="M 0 20 L 90 -35"/>
    </g>
    <circle cx="0" cy="20" r="8" fill="#0c1630" stroke="#6ee7a8" stroke-width="2.5"/>
    <circle cx="90" cy="-35" r="5" fill="#6ee7a8"/>
  </g>
</svg>
